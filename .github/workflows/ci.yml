name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light dependencies (the tests need no heavy ML packages)
        run: pip install numpy scipy pillow opencv-python-headless pytest
      - name: Run tests
        run: pytest -q
